<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Cervellone</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="graph-container"></div>

  <div id="controls-panel" class="controls-panel">
    <div class="button-row">
      <button id="refresh-now-button" class="graph-button" type="button" title="Ricarica solo la vista del grafo (non fa sognare)">
        Aggiorna
      </button>
      <button id="dream-now-button" class="graph-button" type="button" title="Forza subito un ciclo di sogno: rielabora quello di cui hai parlato in nuovi nodi/collegamenti">
        Sogna adesso
      </button>
    </div>
    <div id="dream-feedback" class="dream-feedback hidden"></div>

    <button
      id="quantum-button"
      class="quantum-button"
      type="button"
      title="Ciclo autonomo (max 20 iterazioni): il companion esplora da solo il proprio grafo, collega entita' esistenti o ne aggiunge di nuove, senza ascoltare ne' sognare nel frattempo. Ferma quando vuoi: lascia un appunto per la prossima volta."
    >
      Modalita' Quantum
    </button>
    <p class="quantum-explainer">
      Il companion pensa da solo al proprio grafo per un po' (fino a 20 giri), invece di aspettare che
      tu gli parli o che arrivi l'ora del sogno. Mentre e' attiva non ascolta e non sogna normalmente.
    </p>
    <div id="quantum-status" class="quantum-status hidden"></div>

    <div class="controls-section">
      <label class="checkbox-row">
        <input id="show-labels" type="checkbox" checked />
        Mostra i nomi dei nodi
      </label>
      <p class="control-hint">Col mouse sopra un nodo il nome si vede comunque.</p>
    </div>

    <div class="controls-section">
      <h3 class="controls-section-title">Forze</h3>
      <div class="control-row">
        <label for="attraction">Attrazione: <span id="attraction-value">50</span></label>
        <input id="attraction" type="range" min="0" max="100" step="1" value="50" />
      </div>
      <div class="control-row">
        <label for="repulsion">Repulsione: <span id="repulsion-value">40</span></label>
        <input id="repulsion" type="range" min="0" max="100" step="1" value="40" />
      </div>
    </div>

    <div id="dream-timer" class="dream-timer">
      <div>Ultimo sogno: <span id="last-dream-at">—</span></div>
      <div>Prossimo: <span id="next-dream-at">—</span></div>
    </div>
  </div>

  <div id="node-detail" class="node-detail hidden">
    <button id="node-detail-close" class="node-detail-close" title="Chiudi">✕</button>
    <h2 id="node-detail-title"></h2>
    <div id="node-detail-type" class="node-detail-type"></div>
    <h3>Connessioni</h3>
    <ul id="node-detail-connections"></ul>
  </div>
  <script src="../../../node_modules/force-graph/dist/force-graph.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
