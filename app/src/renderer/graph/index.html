<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Cervellone</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="graph-container"></div>

  <div id="controls-panel" class="controls-panel">
    <button id="refresh-now-button" class="refresh-now-button" type="button">
      Aggiorna adesso
    </button>

    <button
      id="quantum-button"
      class="quantum-button"
      type="button"
      title="Ciclo autonomo (max 20 iterazioni): il companion esplora da solo il proprio grafo, collega entita' esistenti o ne aggiunge di nuove, senza ascoltare ne' sognare nel frattempo. Ferma quando vuoi: lascia un appunto per la prossima volta."
    >
      Modalita' Quantum
    </button>
    <p class="quantum-explainer">
      Il companion pensa da solo al proprio grafo per un po' (fino a 20 giri), invece di aspettare che
      tu gli parli o che arrivi l'ora del sogno. Mentre e' attiva non ascolta e non sogna normalmente.
    </p>
    <div id="quantum-status" class="quantum-status hidden"></div>

    <div class="controls-section">
      <h3 class="controls-section-title">Filtri</h3>
      <div id="type-filter-list" class="type-filter-list"></div>
      <label class="checkbox-row">
        <input id="hide-orphans" type="checkbox" />
        Nascondi nodi isolati (0 collegamenti)
      </label>
    </div>

    <div class="controls-section">
      <h3 class="controls-section-title">Aspetto</h3>
      <div class="control-row">
        <label for="min-connections">Nascondi nomi sotto: <span id="min-connections-value">0</span> collegamenti</label>
        <input id="min-connections" type="range" min="0" max="6" step="1" value="0" />
      </div>
    </div>

    <div class="controls-section">
      <h3 class="controls-section-title">Forze</h3>
      <div class="control-row">
        <label for="repulsion">Repulsione</label>
        <input id="repulsion" type="range" min="20" max="400" step="10" value="120" />
      </div>

      <div class="control-row">
        <label for="attraction">Attrazione (distanza collegamenti)</label>
        <input id="attraction" type="range" min="10" max="200" step="5" value="60" />
      </div>
    </div>

    <div id="dream-timer" class="dream-timer">
      <div>Ultimo sogno: <span id="last-dream-at">—</span></div>
      <div>Prossimo: <span id="next-dream-at">—</span></div>
    </div>
  </div>

  <div id="node-detail" class="node-detail hidden">
    <button id="node-detail-close" class="node-detail-close" title="Chiudi">✕</button>
    <h2 id="node-detail-title"></h2>
    <div id="node-detail-type" class="node-detail-type"></div>
    <h3>Connessioni</h3>
    <ul id="node-detail-connections"></ul>
  </div>
  <script src="../../../node_modules/force-graph/dist/force-graph.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
