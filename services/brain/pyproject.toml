[project]
name = "brain-service"
version = "0.1.0"
description = "Orchestrazione LLM, memoria, dreaming e grafo del companion"
requires-python = ">=3.12"
dependencies = [
    "companion-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "croniter>=2.0",
]

[tool.uv.sources]
companion-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_service"]
