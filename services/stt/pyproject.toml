[project]
name = "stt-service"
version = "0.1.0"
description = "Ascolto continuo e riconoscimento vocale del companion (faster-whisper)"
requires-python = ">=3.12"
dependencies = [
    "companion-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[tool.uv.sources]
companion-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_service"]
