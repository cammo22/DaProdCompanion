[project]
name = "tts-service"
version = "0.1.0"
description = "Sintesi vocale italiana del companion (Kokoro-82M)"
requires-python = ">=3.12"
dependencies = [
    "companion-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
]

[tool.uv.sources]
companion-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_service"]
