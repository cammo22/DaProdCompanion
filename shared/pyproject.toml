[project]
name = "companion-shared"
version = "0.1.0"
description = "Libreria condivisa tra i servizi Python del companion: sandbox filesystem, config, accesso al DB"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion_shared"]
